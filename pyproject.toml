[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingtools"
version = "0.1.0"
description = "Desktop application for analyzing trading data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3,<3",
    "tkcalendar>=1.6,<2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tradingtools*"]

[tool.setuptools.package-data]
tradingtools = ["resources/defaults/*.json"]
